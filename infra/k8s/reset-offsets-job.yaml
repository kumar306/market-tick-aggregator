# run only while normalizer/aggregator/orderbook/persistence are scaled to 0 -
# Kafka rejects an external offset commit while a group still has members
apiVersion: batch/v1
kind: Job
metadata:
  name: reset-offsets
  namespace: default
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: kafka-client
      restartPolicy: Never
      containers:
        - name: reset-offsets
          image: 399400614342.dkr.ecr.us-east-1.amazonaws.com/market-tick-loadtest:v10
          command: ["./loadtest"]
          args: ["-reset-offsets"]
          envFrom:
            - configMapRef: { name: infra-config }
