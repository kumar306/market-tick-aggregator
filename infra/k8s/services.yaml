apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: ui-backend }
  template:
    metadata:
      labels: { app: ui-backend }
    spec:
      serviceAccountName: kafka-client
      containers:
        - name: ui-backend
          image: 399400614342.dkr.ecr.us-east-1.amazonaws.com/market-tick-ui-backend:v5
          env:
            - name: CONFIG_FILE
              value: "./config/docker.config.yaml"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: db-credentials, key: DATABASE_URL } }
            - name: CORS_ALLOWED_ORIGINS
              value: "*"
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - name: config
              mountPath: /app/ui-backend/config/docker.config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap: { name: ui-backend-config }
---
# lb for ui-backend to be hit from UI
apiVersion: v1
kind: Service
metadata:
  name: ui-backend
  namespace: default
spec:
  type: LoadBalancer
  selector: { app: ui-backend }
  loadBalancerSourceRanges: ["106.51.179.89/32"]
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
