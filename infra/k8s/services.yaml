apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: adapter }
  template:
    metadata:
      labels: { app: adapter }
    spec:
      serviceAccountName: kafka-client
      containers:
        - name: adapter
          image: 399400614342.dkr.ecr.us-east-1.amazonaws.com/market-tick-adapter:v5
          env:
            - name: CONFIG_FILE
              value: "./config/docker.config.yaml"
          ports:
            - containerPort: 2112
          resources:
          # requests 0.1vcpu, 16 MB RAM to place the pod, cpu throttles if goes over 0.5 vcpu, and OOM pod killed if ram exceeds 32 MB
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - name: config
              mountPath: /app/adapter/config/docker.config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap: { name: adapter-config }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: normalizer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: normalizer }
  template:
    metadata:
      labels: { app: normalizer }
    spec:
      serviceAccountName: kafka-client
      containers:
        - name: normalizer
          image: 399400614342.dkr.ecr.us-east-1.amazonaws.com/market-tick-normalizer:v5
          env:
            - name: CONFIG_FILE
              value: ./config/docker.config.yaml
            - name: REDIS_ADDR  
              valueFrom: { secretKeyRef: { name: db-credentials, key: REDIS_ADDR } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: REDIS_PASSWORD } }
          ports:
            - containerPort: 2113
          resources:
          # requests: 0.2 vcpu, 32 MB RAM, max: 1 vcpu, max: 64 MB RAM
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          volumeMounts:
            - name: config
              mountPath: /app/normalizer/config/docker.config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap: { name: normalizer-config }
---
