apiVersion: batch/v1
kind: Job
metadata:
  name: loadtest-ramp
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ramp
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export TZ="IST-5:30"
              STEP=60
              for TOTAL in 500 1000 2500 5000 10000; do
                PER_STREAM=$((TOTAL / 6))
                echo "$(date +%Y-%m-%dT%H:%M:%S%z) level start: total=${TOTAL}/s per-stream=${PER_STREAM}/s"
                curl -s "http://binance-mock.default.svc.cluster.local:8081/rate?value=${PER_STREAM}"
                curl -s "http://coinbase-mock.default.svc.cluster.local:8081/rate?value=${PER_STREAM}"
                curl -s "http://kraken-mock.default.svc.cluster.local:8081/rate?value=${PER_STREAM}"
                sleep $STEP
              done
              echo "$(date +%Y-%m-%dT%H:%M:%S%z) ramp complete - last level (10000/s total) keeps running until you dial it back down"
