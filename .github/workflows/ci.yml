name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Go test + vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - adapter
          - aggregator
          - normalizer
          - orderbook
          - persistence
          - shared
          - ui-backend
          - loadtest
          - mockexchange
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      # each module has its own go.mod, so run inside it directly rather
      # than relying on go.work workspace resolution for a bare ./... at
      # the repo root, which does not behave the same on every runner.
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # -short skips the handful of tests that spin up real Kafka/Redis
      # containers via testcontainers - those are real and useful locally,
      # but too timing-sensitive for a shared CI runner pulling fresh
      # images on every run.
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -short ./...

  proto-check:
    name: Generated proto code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - uses: arduino/setup-protoc@v3
        with:
          version: "33.1"

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10

      - name: Regenerate from .proto sources
        run: bash scripts/generate-proto.sh

      # if regenerating produced any diff, the committed .pb.go files were
      # stale relative to their .proto source, and this fails the build
      # instead of letting stale generated code merge silently.
      - name: Fail if generated code is stale
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated proto code is out of date. Run ./scripts/generate-proto.sh and commit the result."
            exit 1
          fi

  frontend:
    name: UI lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
